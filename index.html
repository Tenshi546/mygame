<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GiftUP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');

        :root { 
            --bg: #0f0f13; 
            --surface: #1a1a22;
            --surface-light: #252530;
            --text: #ffffff; 
            --text-muted: #8a8a9a;
            --accent: #ffcc00; 
            --accent-glow: rgba(255, 204, 0, 0.5);
            --accent-dark: #cc9900;
            --success: #00ff88;
            --fail: #ff3333;
            --border: #333340;
            --glass: rgba(26, 26, 34, 0.7);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none;
            background-image: radial-gradient(circle at 50% 0%, #2a2a38 0%, var(--bg) 80%);
        }
        
        /* Верхняя панель */
        .top-bar { 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10;
        }
        
        .logo { 
            font-weight: 900; 
            font-size: 24px; 
            letter-spacing: 1px; 
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo span { color: var(--accent); -webkit-text-fill-color: var(--accent); }
        
        .balance-container { display: flex; align-items: center; gap: 10px; }

        .balance { 
            background: var(--surface-light); 
            padding: 8px 16px; 
            border-radius: 12px; 
            font-weight: 800;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .balance .currency { color: var(--accent); font-size: 14px; }

        .btn-icon {
            background: var(--surface-light);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        
        .btn-icon:active { transform: scale(0.9); }
        .btn-icon.primary { background: var(--accent); color: #000; border: none; box-shadow: 0 4px 15px var(--accent-glow); }

        /* Основной контент */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 0 15px 90px 15px; 
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Колесо Крутки */
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1 / 1;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.6));
        }

        /* Неподвижное колесо */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--surface-light);
            box-shadow: 0 0 40px rgba(0,0,0,0.8) inset;
            position: relative;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Вращающаяся стрелка */
        .arrow-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 20;
            /* Плавная остановка (ease-out) */
            transition: transform 6s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        .arrow-visual {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--accent);
            filter: drop-shadow(0 0 10px var(--accent));
        }

        .wheel-center {
            position: absolute;
            width: 100px;
            height: 100px;
            background: var(--bg);
            border-radius: 50%;
            border: 4px solid var(--surface-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
        }

        /* Слоты */
        .slots-container {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 20px;
        }

        .slot-box {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: 0.3s;
            min-height: 130px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .slot-box:active { transform: scale(0.97); }
        .slot-box.target-active { border-color: var(--accent); box-shadow: 0 0 20px rgba(255,204,0,0.15); cursor: default; }

        .slot-title { font-size: 10px; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; text-transform: uppercase;}
        
        .slot-img {
            width: 55px; height: 55px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6));
        }

        .slot-price {
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            color: var(--accent);
        }

        .slot-placeholder {
            width: 55px; height: 55px;
            border: 2px dashed #444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #444;
            margin-bottom: 8px;
        }

        /* Панель управления */
        .center-controls {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--surface);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .chance-display {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: 2px;
        }
        .chance-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .multiplier-panel {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 15px;
        }
        
        .mult-btn {
            flex: 1;
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 12px 0;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            font-size: 15px;
            font-family: inherit;
        }

        .mult-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .action-btn { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(180deg, #ffdd33 0%, #ffcc00 100%);
            border: none; 
            border-radius: 14px; 
            font-weight: 900; 
            font-size: 18px; 
            color: #000; 
            cursor: pointer; 
            box-shadow: 0 8px 25px var(--accent-glow);
            transition: 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
        }
        
        .action-btn:active { transform: scale(0.97); }
        .action-btn:disabled { background: #333; color: #666; box-shadow: none; }

        /* Нижнее меню */
        .bottom-nav { 
            position: fixed;
            bottom: 0; left: 0; right: 0;
            display: flex; 
            justify-content: space-around; 
            padding: 12px 10px 25px 10px; 
            background: rgba(15, 15, 19, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border); 
            z-index: 50;
        }
        
        .nav-item { 
            color: var(--text-muted); 
            font-size: 10px; 
            text-align: center; 
            cursor: pointer; 
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }
        
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 22px; }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
        }
        
        .modal-overlay.active { display: flex; }
        
        .modal-content {
            background: var(--surface);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s cubic-bezier(0.1, 0.7, 0.1, 1);
            border-top: 1px solid var(--border);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .modal-title { font-size: 20px; font-weight: 800; }
        
        .close-btn {
            background: var(--surface-light); 
            border: none; 
            color: var(--text); 
            width: 32px; height: 32px; 
            border-radius: 50%; 
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            overflow-y: auto;
            padding-bottom: 30px;
        }

        .inv-item {
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .inv-item:active { transform: scale(0.95); }

        .inv-item img {
            width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }
        
        .inv-item .name { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
        .inv-item .price { font-size: 14px; color: var(--accent); font-weight: 800; margin-bottom: 10px;}

        .buy-btn {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
        }
        .buy-btn:active { background: #fff; }
        .buy-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

        /* Экран победы */
        .win-screen { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        .win-screen h2 { font-size: 28px; color: var(--success); margin-bottom: 20px; text-shadow: 0 0 20px rgba(0,255,136,0.5); }
        .win-screen img { width: 120px; height: 120px; margin-bottom: 15px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); }
        .win-screen .prize-name { font-size: 22px; font-weight: 800; margin-bottom: 5px; }
        .win-screen .prize-price { font-size: 18px; color: var(--accent); font-weight: 800; margin-bottom: 30px; }
        
        .win-actions { display: flex; gap: 10px; width: 100%; max-width: 300px; }
        .win-btn { flex: 1; padding: 15px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; border: none; font-family: inherit; text-transform: uppercase;}
        .win-btn.upgrade { background: var(--accent); color: #000; }
        .win-btn.sell { background: var(--surface-light); color: #fff; border: 1px solid var(--border); }

        /* Тост */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--surface-light);
            border: 1px solid var(--accent);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            z-index: 200;
            transition: 0.3s;
            opacity: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">GIFT<span>UP</span></div>
        <div class="balance-container">
            <div class="balance"><span class="currency">₽</span> <span id="balance">1000</span></div>
            <button class="btn-icon primary" onclick="openModal('deposit-modal')">+</button>
        </div>
    </div>

    <div class="main-content">
        
        <!-- Колесо -->
        <div class="wheel-wrapper">
            <div class="wheel" id="wheel">
                <div class="wheel-center">
                    <span style="font-size: 24px; font-weight: 900; color: var(--text);">GIFT</span>
                    <span style="font-size: 10px; color: var(--text-muted); margin-top: 2px;">UP</span>
                </div>
            </div>
            <div class="arrow-wrapper" id="arrow-wrapper">
                <div class="arrow-visual"></div>
            </div>
        </div>

        <!-- Слоты -->
        <div class="slots-container">
            <div class="slot-box" id="slot-source" onclick="openInventory()">
                <!-- JS -->
            </div>
            
            <div class="slot-box target-active" id="slot-target">
                <!-- JS -->
            </div>
        </div>

        <!-- Управление -->
        <div class="center-controls">
            <div class="chance-display" id="chance-value">50.00%</div>
            <div class="chance-label">ШАНС УСПЕХА</div>

            <div class="multiplier-panel">
                <button class="mult-btn active" onclick="setMultiplier(2, this)">x2</button>
                <button class="mult-btn" onclick="setMultiplier(3, this)">x3</button>
                <button class="mult-btn" onclick="setMultiplier(4, this)">x4</button>
                <button class="mult-btn" onclick="setMultiplier(5, this)">x5</button>
                <button class="mult-btn" onclick="setMultiplier(10, this)">x10</button>
            </div>

            <button class="action-btn" id="spin-btn" onclick="spin()">КРУТИТЬ</button>
        </div>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <div class="nav-item active"><span class="nav-icon">🎮</span>ИГРА</div>
        <div class="nav-item" onclick="openInventory()"><span class="nav-icon">🎒</span>ИНВЕНТАРЬ</div>
        <div class="nav-item" onclick="openShop()"><span class="nav-icon">🛒</span>МАГАЗИН</div>
        <div class="nav-item" onclick="openModal('deposit-modal')"><span class="nav-icon">💳</span>БАЛАНС</div>
    </div>

    <!-- Модальное окно: Инвентарь -->
    <div class="modal-overlay" id="inventory-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Ваш инвентарь</div>
                <button class="close-btn" onclick="closeModal('inventory-modal')">✕</button>
            </div>
            <div class="inventory-grid" id="inventory-list">
                <!-- JS -->
            </div>
            <div id="empty-inventory" style="text-align: center; color: var(--text-muted); margin-top: 50px; display: none;">
                Инвентарь пуст. Купите подарки в магазине!
            </div>
        </div>
    </div>

    <!-- Модальное окно: Магазин -->
    <div class="modal-overlay" id="shop-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Магазин</div>
                <button class="close-btn" onclick="closeModal('shop-modal')">✕</button>
            </div>
            <div class="inventory-grid" id="shop-list">
                <!-- JS -->
            </div>
        </div>
    </div>

    <!-- Модальное окно: Экран Победы -->
    <div class="modal-overlay" id="win-modal">
        <div class="modal-content" style="height: auto; padding: 40px 20px; text-align: center;">
            <div class="win-screen">
                <h2>ВЫИГРЫШ!</h2>
                <img src="" id="win-img" alt="Win">
                <div class="prize-name" id="win-name">Подарок</div>
                <div class="prize-price" id="win-price">100 ₽</div>
                <div class="win-actions">
                    <button class="win-btn upgrade" onclick="actionUpgrade()">В АПГРЕЙД</button>
                    <button class="win-btn sell" onclick="actionSell()">ПРОДАТЬ ЗА <span id="sell-price">80</span> ₽</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно: Пополнение -->
    <div class="modal-overlay" id="deposit-modal">
        <div class="modal-content" style="height: auto;">
            <div class="modal-header">
                <div class="modal-title">Пополнение</div>
                <button class="close-btn" onclick="closeModal('deposit-modal')">✕</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="inv-item" style="flex-direction: row; justify-content: space-between; padding: 15px 20px;" onclick="showToast('В разработке')">
                    <span>💳 Банковская карта</span> <span>→</span>
                </button>
                <button class="inv-item" style="flex-direction: row; justify-content: space-between; padding: 15px 20px;" onclick="showToast('В разработке')">
                    <span>⭐ Telegram Stars</span> <span>→</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Тост -->
    <div class="toast" id="toast">Текст</div>

            { id: 25, name: "Звезда", price: 5000, img: "https://cdn-icons-png.flaticon.com/512/1828/1828884.png" },
            { id: 26, name: "Робот", price: 6000, img: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png" },
            { id: 27, name: "Замок", price: 7000, img: "https://cdn-icons-png.flaticon.com/512/3063/3063822.png" },
            { id: 28, name: "Алмаз", price: 8000, img: "https://cdn-icons-png.flaticon.com/512/2954/2954941.png" },
            { id: 29, name: "Дракон", price: 9000, img: "https://cdn-icons-png.flaticon.com/512/3468/3468081.png" },
            { id: 30, name: "Единорог", price: 10000, img: "https://cdn-icons-png.flaticon.com/512/3468/3468103.png" },
            { id: 31, name: "Планета", price: 12000, img: "https://cdn-icons-png.flaticon.com/512/3212/3212625.png" },
            { id: 32, name: "Феникс", price: 14000, img: "https://cdn-icons-png.flaticon.com/512/3468/3468115.png" },
            { id: 33, name: "Космос", price: 16000, img: "https://cdn-icons-png.flaticon.com/512/3212/3212620.png" },
            { id: 34, name: "Комета", price: 18000, img: "https://cdn-icons-png.flaticon.com/512/3212/3212608.png" },
            { id: 35, name: "Галактика", price: 20000, img: "https://cdn-icons-png.flaticon.com/512/3212/3212620.png" }
        ];

        let userInventory = []; // Изначально пусто
        let slotSourceGift = null;
        let slotTargetGift = null;
        let wonGift = null;

        // --- ИНИЦИАЛИЗАЦИЯ ---
        function init() {
            updateUI();
        }

        function updateTarget() {
            if (!slotSourceGift) { slotTargetGift = null; return; }
            
            const targetPrice = slotSourceGift.price * currentMultiplier;
            let closestGift = null;
            let minDiff = Infinity;

            allGifts.forEach(gift => {
                if (gift.id === slotSourceGift.id) return;
                const diff = Math.abs(gift.price - targetPrice);
                const isAbove = gift.price >= targetPrice;
                
                if (isAbove && diff < minDiff) {
                    minDiff = diff;
                    closestGift = gift;
                } else if (!closestGift && diff < minDiff) {
                    minDiff = diff;
                    closestGift = gift;
                }
            });
            slotTargetGift = closestGift;
        }

        function updateUI() {
            document.getElementById('balance').innerText = userBalance.toFixed(0);
            renderSlot('source', slotSourceGift);
            renderSlot('target', slotTargetGift);
            document.getElementById('chance-value').innerText = currentChance.toFixed(2) + '%';
            drawWheel();
        }

        function renderSlot(type, gift) {
            const el = document.getElementById(`slot-${type}`);
            const title = type === 'source' ? "ВАШ ПОДАРОК" : "ВЫ ПОЛУЧИТЕ";
            
            if (gift) {
                el.innerHTML = `
                    <div class="slot-title">${title}</div>
                    <img src="${gift.img}" class="slot-img">
                    <div class="slot-price">${gift.price} ₽</div>
                `;
            } else {
                el.innerHTML = `<div class="slot-title">${title}</div><div class="slot-placeholder">+</div>`;
            }
        }

        // --- ОТРИСОВКА КОЛЕСА ---
        function drawWheel() {
            const wheel = document.getElementById('wheel');
            const deg = (currentChance / 100) * 360;
            
            // Начинаем ровно с 6 часов (180 градусов) и идем по часовой стрелке
            const start = 180;
            const end = start + deg;
            
            wheel.style.background = `conic-gradient(
                var(--surface-light) 0deg ${start}deg, 
                var(--accent) ${start}deg ${end}deg, 
                var(--surface-light) ${end}deg 360deg
            )`;
        }

        // --- ВЗАИМОДЕЙСТВИЕ ---
        function setMultiplier(mult, btn) {
            if (isSpinning) return;
            currentMultiplier = mult;
            currentChance = 100 / mult;
            
            document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            updateTarget();
            updateUI();
        }

        function openInventory() {
            if (isSpinning) return;
            const list = document.getElementById('inventory-list');
            const emptyMsg = document.getElementById('empty-inventory');
            list.innerHTML = '';
            
            if (userInventory.length === 0) {
                emptyMsg.style.display = 'block';
            } else {
                emptyMsg.style.display = 'none';
                userInventory.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'inv-item';
                    div.innerHTML = `<img src="${item.img}"><div class="name">${item.name}</div><div class="price">${item.price} ₽</div>`;
                    div.onclick = () => {
                        slotSourceGift = item;
                        updateTarget();
                        updateUI();
                        closeModal('inventory-modal');
                    };
                    list.appendChild(div);
                });
            }
            openModal('inventory-modal');
        }

        function openShop() {
            if (isSpinning) return;
            const list = document.getElementById('shop-list');
            list.innerHTML = '';
            allGifts.forEach(item => {
                const div = document.createElement('div');
                div.className = 'inv-item';
                const canAfford = userBalance >= item.price;
                div.innerHTML = `
                    <img src="${item.img}">
                    <div class="name">${item.name}</div>
                    <div class="price">${item.price} ₽</div>
                    <button class="buy-btn" ${!canAfford ? 'disabled' : ''} onclick="buyGift(${item.id}, event)">${canAfford ? 'КУПИТЬ' : 'НЕТ СРЕДСТВ'}</button>
                `;
                list.appendChild(div);
            });
            openModal('shop-modal');
        }

        function buyGift(id, event) {
            event.stopPropagation();
            const gift = allGifts.find(g => g.id === id);
            if (userBalance >= gift.price) {
                userBalance -= gift.price;
                userInventory.push(gift);
                showToast(`Куплено: ${gift.name}`);
                updateUI();
                openShop(); // Обновить магазин, чтобы скрыть купленное
            }
        }

        // --- АНИМАЦИЯ КРУТКИ ---
        function spin() {
            if (isSpinning) return;
            if (!slotSourceGift) { showToast("Сначала купите и выберите подарок!"); return; }
            
            isSpinning = true;
            const btn = document.getElementById('spin-btn');
            const arrow = document.getElementById('arrow-wrapper');
            
            btn.disabled = true;
            btn.innerText = "КРУТИМ...";
            
            const win = Math.random() * 100 <= currentChance;
            
            // Начало желтой зоны = 180 градусов.
            // Конец = 180 + (шанс * 3.6).
            let targetDeg = 0;
            const startDeg = 180;
            const yellowDeg = (currentChance / 100) * 360;
            
            if (win) {
                // Стрелка падает в желтую зону
                targetDeg = startDeg + Math.random() * yellowDeg;
            } else {
                // Стрелка падает в серую зону
                const grayStart = startDeg + yellowDeg;
                const grayLength = 360 - yellowDeg;
                targetDeg = grayStart + Math.random() * grayLength;
            }

            // Делаем 6 полных оборотов (2160 градусов) для интриги
            const finalRotation = (360 * 6) + targetDeg;
            
            // Плавная остановка (6 секунд)
            arrow.style.transition = `transform 6s cubic-bezier(0.1, 0.8, 0.1, 1)`;
            arrow.style.transform = `rotate(${finalRotation}deg)`;

            setTimeout(() => {
                if (win) {
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    wonGift = { ...slotTargetGift };
                    showWinScreen(wonGift);
                } else {
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    showToast("ПРОВАЛ. Подарок сгорел.");
                    // Удаляем сгоревший предмет из инвентаря
                    if (slotSourceGift) {
                        userInventory = userInventory.filter(g => g.id !== slotSourceGift.id);
                    }
                    slotSourceGift = null;
                    updateTarget();
                    updateUI();
                }

                // Возврат стрелки в исходное положение (без анимации)
                setTimeout(() => {
                    arrow.style.transition = 'none';
                    arrow.style.transform = `rotate(0deg)`;
                    
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerText = "КРУТИТЬ";
                        isSpinning = false;
                    }, 50);
                }, 500);

            }, 6000);
        }

        // --- ЭКРАН ПОБЕДЫ ---
        function showWinScreen(gift) {
            document.getElementById('win-img').src = gift.img;
            document.getElementById('win-name').innerText = gift.name;
            document.getElementById('win-price').innerText = gift.price + ' ₽';
            document.getElementById('sell-price').innerText = Math.floor(gift.price * 0.8);
            openModal('win-modal');
        }

        function actionUpgrade() {
            if (!userInventory.find(g => g.id === wonGift.id)) {
                userInventory.push(wonGift);
            }
            slotSourceGift = wonGift;
            updateTarget();
            updateUI();
            closeModal('win-modal');
        }

        function actionSell() {
            const sellPrice = Math.floor(wonGift.price * 0.8);
            userBalance += sellPrice;
            slotSourceGift = null;
            updateTarget();
            updateUI();
            closeModal('win-modal');
            showToast(`Продано за ${sellPrice} ₽`);
        }

        // --- УТИЛИТЫ ---
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Запуск
        init();

    </script>
</body>
    </html>
