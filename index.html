<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GiftUP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');

        :root { 
            --bg: #0a0a0c; 
            --surface: #15151a;
            --surface-light: #202028;
            --text: #ffffff; 
            --text-muted: #7a7a85;
            --accent: #ffcc00; 
            --accent-glow: rgba(255, 204, 0, 0.4);
            --purple: #8a2be2;
            --success: #00ff88;
            --fail: #ff3333;
            --border: #2a2a35;
            --glass: rgba(30, 30, 40, 0.6);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none;
            background-image: radial-gradient(circle at 50% 0%, #1e1e28 0%, var(--bg) 70%);
        }
        
        /* Верхняя панель */
        .top-bar { 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10;
        }
        
        .logo { 
            font-weight: 900; 
            font-size: 22px; 
            letter-spacing: 1px; 
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo span { color: var(--accent); -webkit-text-fill-color: var(--accent); }
        
        .balance-container { display: flex; align-items: center; gap: 10px; }

        .balance { 
            background: var(--surface-light); 
            padding: 8px 16px; 
            border-radius: 12px; 
            font-weight: 800;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .balance .currency { color: var(--accent); font-size: 14px; }

        .btn-add-balance {
            background: var(--accent);
            color: #000;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: 0.2s;
        }
        
        .btn-add-balance:active { transform: scale(0.9); }

        /* Основной контент */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 0 15px 90px 15px; 
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Колесо Крутки */
        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 200px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 20px;
            background: var(--glass);
            border: 1px solid var(--border);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .wheel-pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 120%;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            z-index: 10;
        }
        .wheel-pointer::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid var(--accent);
        }

        .wheel-track {
            display: flex;
            align-items: center;
            height: 100%;
            transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
            will-change: transform;
        }

        .wheel-item {
            width: 90px;
            height: 120px;
            margin: 0 5px;
            border-radius: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .wheel-item img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; }
        .wheel-item .price { font-size: 12px; font-weight: 800; color: var(--accent); }

        /* Слоты */
        .slots-container {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 20px;
        }

        .slot-box {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: 0.3s;
            min-height: 140px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .slot-box:active { transform: scale(0.97); }
        .slot-box.target-active { border-color: var(--purple); box-shadow: 0 0 20px rgba(138,43,226,0.3); }

        .slot-title { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .slot-img {
            width: 65px; height: 65px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6));
        }

        .slot-price {
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .slot-price span { color: var(--accent); font-size: 11px; }

        .slot-placeholder {
            width: 65px; height: 65px;
            border: 2px dashed #444;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #444;
            margin-bottom: 8px;
        }

        /* Центральная зона шансов */
        .center-controls {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--surface);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .chance-display {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: 5px;
        }
        .chance-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* Панель множителей */
        .multiplier-panel {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 15px;
        }
        
        .mult-btn {
            flex: 1;
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 12px 0;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            font-size: 15px;
            font-family: inherit;
        }

        .mult-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Кнопка действия */
        .action-btn { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(180deg, #ffe066 0%, #ffcc00 100%);
            border: none; 
            border-radius: 14px; 
            font-weight: 900; 
            font-size: 18px; 
            color: #000; 
            cursor: pointer; 
            box-shadow: 0 8px 25px var(--accent-glow);
            transition: 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .action-btn:active { transform: scale(0.97); }
        .action-btn:disabled { background: #333; color: #666; box-shadow: none; }

        /* Нижнее меню */
        .bottom-nav { 
            position: fixed;
            bottom: 0; left: 0; right: 0;
            display: flex; 
            justify-content: space-around; 
            padding: 12px 10px 25px 10px; 
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border); 
            z-index: 50;
        }
        
        .nav-item { 
            color: var(--text-muted); 
            font-size: 10px; 
            text-align: center; 
            cursor: pointer; 
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }
        
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 22px; }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
        }
        
        .modal-overlay.active { display: flex; }
        
        .modal-content {
            background: var(--surface);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s cubic-bezier(0.1, 0.7, 0.1, 1);
            border-top: 1px solid var(--border);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title { font-size: 20px; font-weight: 800; }
        
        .close-btn {
            background: var(--surface-light); 
            border: none; 
            color: var(--text); 
            width: 32px; height: 32px; 
            border-radius: 50%; 
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            overflow-y: auto;
            padding-bottom: 30px;
        }

        .inv-item {
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .inv-item:active { transform: scale(0.95); border-color: var(--accent); }

        .inv-item img {
            width: 70px; height: 70px; object-fit: contain; margin-bottom: 10px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }
        
        .inv-item .name { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
        .inv-item .price { font-size: 14px; color: var(--accent); font-weight: 800; display: flex; align-items: center; gap: 3px;}

        /* Тост */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--surface-light);
            border: 1px solid var(--accent);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            z-index: 200;
            transition: 0.3s;
            opacity: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">GIFT<span>UP</span></div>
        <div class="balance-container">
            <div class="balance"><span class="currency">G</span> <span id="balance">1250</span></div>
            <button class="btn-add-balance" onclick="openModal('deposit-modal')">+</button>
        </div>
    </div>

    <div class="main-content">
        
        <!-- Колесо (Лента) -->
        <div class="wheel-container" id="wheel-container">
            <div class="wheel-pointer"></div>
            <div class="wheel-track" id="wheel-track">
                <!-- JS заполнит ленту -->
            </div>
        </div>

        <!-- Слоты -->
        <div class="slots-container">
            <div class="slot-box" id="slot-source" onclick="openInventory('source')">
                <!-- JS -->
            </div>
            
            <div class="slot-box target-active" id="slot-target" onclick="openInventory('target')">
                <!-- JS -->
            </div>
        </div>

        <!-- Управление -->
        <div class="center-controls">
            <div class="chance-display" id="chance-value">50.00%</div>
            <div class="chance-label" id="chance-label">ШАНС УСПЕХА</div>

            <div class="multiplier-panel">
                <button class="mult-btn active" onclick="setMultiplier(2, this)">x2</button>
                <button class="mult-btn" onclick="setMultiplier(3, this)">x3</button>
                <button class="mult-btn" onclick="setMultiplier(4, this)">x4</button>
                <button class="mult-btn" onclick="setMultiplier(5, this)">x5</button>
                <button class="mult-btn" onclick="setMultiplier(10, this)">x10</button>
            </div>

            <button class="action-btn" id="spin-btn" onclick="spin()">ПРОКАЧАТЬ</button>
        </div>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <div class="nav-item active"><span class="nav-icon">🎮</span>ИГРА</div>
        <div class="nav-item" onclick="openInventory('source')"><span class="nav-icon">🎁</span>ИНВЕНТАРЬ</div>
        <div class="nav-item" onclick="openModal('deposit-modal')"><span class="nav-icon">💳</span>БАЛАНС</div>
        <div class="nav-item"><span class="nav-icon">👤</span>ПРОФИЛЬ</div>
    </div>

    <!-- Модальное окно: Инвентарь / Магазин -->
    <div class="modal-overlay" id="inventory-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="inventory-title">Выберите подарок</div>
                <button class="close-btn" onclick="closeModal('inventory-modal')">✕</button>
            </div>
            <div class="inventory-grid" id="inventory-list">
                <!-- JS -->
            </div>
        </div>
    </div>

    <!-- Модальное окно: Пополнение -->
    <div class="modal-overlay" id="deposit-modal">
        <div class="modal-content" style="height: auto; max-height: 80vh;">
            <div class="modal-header">
                <div class="modal-title">Пополнение</div>
                <button class="close-btn" onclick="closeModal('deposit-modal')">✕</button>
            </div>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px; text-align: center;">Выберите способ оплаты</p>
            
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="inv-item" style="flex-direction: row; justify-content: space-between; padding: 15px 20px;" onclick="showToast('В разработке')">
                    <span>💳 Банковская карта</span> <span>→</span>
                </button>
                <button class="inv-item" style="flex-direction: row; justify-content: space-between; padding: 15px 20px;" onclick="showToast('В разработке')">
                    <span>⚡ СБП</span> <span>→</span>
                </button>
                <button class="inv-item" style="flex-direction: row; justify-content: space-between; padding: 15px 20px;" onclick="showToast('В разработке')">
                    <span>⭐ Telegram Stars</span> <span>→</span>
                </button>
                <button class="inv-item" style="flex-direction: row; justify-content: space-between; padding: 15px 20px;" onclick="showToast('В разработке')">
                    <span>💎 Криптовалюта</span> <span>→</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Тост -->
    <div class="toast" id="toast">Текст</div>

    <script>
        let tg = window.Telegram.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // --- ДАННЫЕ ---
        let userBalance = 1250;
        let currentMultiplier = 2;
        let currentChance = 50;
        let isSpinning = false;
        let activeSlot = 'source';

        // МАССИВ ИЗ 30 ПОДАРКОВ (имитация реальных Telegram NFT)
        // Картинки взяты с надежного CDN, чтобы не было синих квадратов
        const allGifts = [
            { id: 1, name: "Мишка", price: 50, img: "https://cdn-icons-png.flaticon.com/512/2985/2985114.png" },
            { id: 2, name: "Сердце", price: 100, img: "https://cdn-icons-png.flaticon.com/512/833/833472.png" },
            { id: 3, name: "Ракета", price: 250, img: "https://cdn-icons-png.flaticon.com/512/3212/3212608.png" },
            { id: 4, name: "Кубок", price: 500, img: "https://cdn-icons-png.flaticon.com/512/3112/3112946.png" },
            { id: 5, name: "Корона", price: 1000, img: "https://cdn-icons-png.flaticon.com/512/2662/2662503.png" },
            { id: 6, name: "Алмаз", price: 2500, img: "https://cdn-icons-png.flaticon.com/512/2954/2954941.png" },
            { id: 7, name: "Пицца", price: 150, img: "https://cdn-icons-png.flaticon.com/512/1404/1404945.png" },
            { id: 8, name: "Кот", price: 300, img: "https://cdn-icons-png.flaticon.com/512/616/616408.png" },
            { id: 9, name: "Собака", price: 400, img: "https://cdn-icons-png.flaticon.com/512/616/616430.png" },
            { id: 10, name: "Дельфин", price: 800, img: "https://cdn-icons-png.flaticon.com/512/616/616494.png" },
            { id: 11, name: "Бабочка", price: 1200, img: "https://cdn-icons-png.flaticon.com/512/616/616565.png" },
            { id: 12, name: "Дракон", price: 3000, img: "https://cdn-icons-png.flaticon.com/512/3468/3468081.png" },
            { id: 13, name: "Единорог", price: 3500, img: "https://cdn-icons-png.flaticon.com/512/3468/3468103.png" },
            { id: 14, name: "Феникс", price: 5000, img: "https://cdn-icons-png.flaticon.com/512/3468/3468115.png" },
            { id: 15, name: "Гриб", price: 80, img: "https://cdn-icons-png.flaticon.com/512/1164/1164580.png" },
            { id: 16, name: "Лист", price: 60, img: "https://cdn-icons-png.flaticon.com/512/1164/1164619.png" },
            { id: 17, name: "Огонь", price: 200, img: "https://cdn-icons-png.flaticon.com/512/785/785116.png" },
            { id: 18, name: "Вода", price: 220, img: "https://cdn-icons-png.flaticon.com/512/3105/3105807.png" },
            { id: 19, name: "Молния", price: 450, img: "https://cdn-icons-png.flaticon.com/512/3194/3194766.png" },
            { id: 20, name: "Снежинка", price: 600, img: "https://cdn-icons-png.flaticon.com/512/3194/3194789.png" },
            { id: 21, name: "Звезда", price: 1500, img: "https://cdn-icons-png.flaticon.com/512/1828/1828884.png" },
            { id: 22, name: "Планета", price: 4000, img: "https://cdn-icons-png.flaticon.com/512/3212/3212625.png" },
            { id: 23, name: "Космос", price: 6000, img: "https://cdn-icons-png.flaticon.com/512/3212/3212620.png" },
            { id: 24, name: "Робот", price: 1800, img: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png" },
            { id: 25, name: "Призрак", price: 900, img: "https://cdn-icons-png.flaticon.com/512/3325/3325133.png" },
            { id: 26, name: "Тыква", price: 120, img: "https://cdn-icons-png.flaticon.com/512/3193/3193007.png" },
            { id: 27, name: "Череп", price: 700, img: "https://cdn-icons-png.flaticon.com/512/2954/2954952.png" },
            { id: 28, name: "Меч", price: 1100, img: "https://cdn-icons-png.flaticon.com/512/3112/3112947.png" },
            { id: 29, name: "Щит", price: 1400, img: "https://cdn-icons-png.flaticon.com/512/3112/3112956.png" },
            { id: 30, name: "Замок", price: 2000, img: "https://cdn-icons-png.flaticon.com/512/3063/3063822.png" }
        ];

        let userInventory = [
            allGifts[0], // Мишка
            allGifts[1], // Сердце
            allGifts[2]  // Ракета
        ];

        let slotSourceGift = userInventory[0];
        let slotTargetGift = allGifts[3]; // Кубок (500)

        // --- ИНИЦИАЛИЗАЦИЯ ---
        function init() {
            updateUI();
            renderWheel();
        }

        function updateUI() {
            document.getElementById('balance').innerText = userBalance.toFixed(0);
            renderSlot('source', slotSourceGift);
            renderSlot('target', slotTargetGift);
            document.getElementById('chance-value').innerText = currentChance.toFixed(2) + '%';
        }

        function renderSlot(type, gift) {
            const el = document.getElementById(`slot-${type}`);
            const title = type === 'source' ? "ВЫБЕРИТЕ ПОДАРОК" : "ВЫБЕРИТЕ ЦЕЛЬ";
            
            if (gift) {
                el.innerHTML = `
                    <div class="slot-title">${title}</div>
                    <img src="${gift.img}" class="slot-img">
                    <div class="slot-price">${gift.price} <span>G</span></div>
                `;
            } else {
                el.innerHTML = `
                    <div class="slot-title">${title}</div>
                    <div class="slot-placeholder">+</div>
                `;
            }
        }

        // --- РЕНДЕР КОЛЕСА ---
        function renderWheel() {
            const track = document.getElementById('wheel-track');
            track.innerHTML = '';
            
            // Генерируем 50 элементов для бесконечной прокрутки
            for(let i=0; i<50; i++) {
                const gift = allGifts[Math.floor(Math.random() * allGifts.length)];
                const item = document.createElement('div');
                item.className = 'wheel-item';
                item.innerHTML = `
                    <img src="${gift.img}">
                    <div class="price">${gift.price} G</div>
                `;
                track.appendChild(item);
            }
        }

        // --- ВЗАИМОДЕЙСТВИЕ ---
        function setMultiplier(mult, btn) {
            if (isSpinning) return;
            currentMultiplier = mult;
            currentChance = 100 / mult;
            
            document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            document.getElementById('chance-value').innerText = currentChance.toFixed(2) + '%';
        }

        function openInventory(type) {
            if (isSpinning) return;
            activeSlot = type;
            
            const title = document.getElementById('inventory-title');
            title.innerText = type === 'source' ? "Ваш инвентарь" : "Магазин подарков";
            
            renderInventoryList();
            openModal('inventory-modal');
        }

        function renderInventoryList() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            
            // Если выбираем цель - показываем магазин (все подарки), если источник - инвентарь
            let items = activeSlot === 'source' ? userInventory : allGifts;

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'inv-item';
                div.innerHTML = `
                    <img src="${item.img}">
                    <div class="name">${item.name}</div>
                    <div class="price">${item.price} <span>G</span></div>
                `;
                
                // Нельзя выбрать один и тот же предмет целью
                if (activeSlot === 'target' && slotSourceGift && item.id === slotSourceGift.id) {
                    div.style.opacity = '0.3';
                } else {
                    div.onclick = () => {
                        if(activeSlot === 'source') slotSourceGift = item;
                        else slotTargetGift = item;
                        updateUI();
                        closeModal('inventory-modal');
                    };
                }
                list.appendChild(div);
            });
        }

        // --- АНИМАЦИЯ КРУТКИ ---
        function spin() {
            if (isSpinning) return;
            if (!slotSourceGift || !slotTargetGift) {
                showToast("Выберите подарки!");
                return;
            }
            
            isSpinning = true;
            const btn = document.getElementById('spin-btn');
            const track = document.getElementById('wheel-track');
            const container = document.getElementById('wheel-container');
            
            btn.disabled = true;
            btn.innerText = "КРУТИМ...";
            
            // Вычисляем сколько пикселей нужно прокрутить
            // Один элемент = 100px (90 ширины + 10 отступы)
            const itemWidth = 100; 
            
            // Визуально прокручиваем на 30-40 элементов вперед
            const spins = 30 + Math.floor(Math.random() * 10);
            const targetX = -(spins * itemWidth);
            
            track.style.transform = `translateX(${targetX}px)`;

            // Ждем окончания анимации (4 секунды)
            setTimeout(() => {
                const win = Math.random() * 100 <= currentChance;
                
                if (win) {
                    showToast("УСПЕХ! Подарок улучшен!");
                    slotSourceGift = { ...slotTargetGift };
                    if (!userInventory.find(g => g.id === slotTargetGift.id)) {
                        userInventory.push(slotTargetGift);
                    }
                    userBalance += 50;
                } else {
                    showToast("ПРОВАЛ. Подарок сгорел.");
                    slotSourceGift = null;
                }

                updateUI();

                // Возвращаем ленту в исходное положение без анимации
                setTimeout(() => {
                    track.style.transition = 'none';
                    track.style.transform = `translateX(0px)`;
                    
                    // Через мгновение возвращаем анимацию (чтобы следующий раз крутилось плавно)
                    setTimeout(() => {
                        track.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)';
                        btn.disabled = false;
                        btn.innerText = "ПРОКАЧАТЬ";
                        isSpinning = false;
                    }, 50);
                }, 500);

            }, 4000);
        }

        // --- УТИЛИТЫ ---
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Запуск
        init();

    </script>
</body>
</html>
