<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GiftUP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');

        :root { 
            --bg: #0a0a0e; 
            --surface: #141419;
            --surface-light: #1f1f26;
            --text: #ffffff; 
            --text-muted: #8b8b9e;
            --accent: #ffcc00; 
            --accent-glow: rgba(255, 204, 0, 0.4);
            --success: #00ff88;
            --fail: #ff3333;
            --border: #2a2a35;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none;
            background-image: radial-gradient(circle at 50% -10%, #2a2a38 0%, var(--bg) 70%);
        }
        
        /* Верхняя панель */
        .top-bar { 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10;
        }
        
        .logo { 
            font-weight: 900; 
            font-size: 26px; 
            letter-spacing: 1.5px; 
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo span { color: var(--accent); -webkit-text-fill-color: var(--accent); }
        
        .balance-container { display: flex; align-items: center; gap: 8px; }

        .balance { 
            background: var(--surface-light); 
            padding: 8px 16px; 
            border-radius: 12px; 
            font-weight: 800;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; gap: 6px; font-size: 16px;
        }
        
        .balance .currency { color: var(--accent); font-size: 14px; }

        .btn-icon {
            background: var(--surface-light); color: #fff; width: 38px; height: 38px;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05);
        }
        .btn-icon.primary { background: var(--accent); color: #000; border: none; }

        /* Основной контент */
        .main-content { 
            flex: 1; display: flex; flex-direction: column; align-items: center; 
            padding: 0 15px 90px 15px; overflow-y: auto; position: relative;
        }
        
        /* Переключатель игр */
        .game-switcher {
            display: flex; background: var(--surface); border-radius: 14px; padding: 4px;
            width: 100%; max-width: 360px; margin-bottom: 15px; border: 1px solid var(--border);
        }
        .game-tab {
            flex: 1; padding: 10px; text-align: center; font-weight: 800; font-size: 14px;
            color: var(--text-muted); cursor: pointer; border-radius: 10px; text-transform: uppercase;
        }
        .game-tab.active { background: var(--surface-light); color: var(--accent); }

        /* ЭКРАН АПГРЕЙД */
        #screen-upgrade { width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        .wheel-wrapper {
            position: relative; width: 100%; max-width: 290px; aspect-ratio: 1 / 1;
            margin: 15px 0 25px 0; display: flex; align-items: center; justify-content: center;
        }

        .wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 5px solid var(--surface-light);
            box-shadow: 0 0 50px rgba(0,0,0,0.9) inset; position: relative; background: var(--surface);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .arrow-wrapper {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;
            z-index: 20; transition: transform 5s cubic-bezier(0.15, 0.85, 0.15, 1);
        }

        .arrow-visual {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent;
            border-top: 32px solid var(--accent); filter: drop-shadow(0 0 12px var(--accent));
        }

        .wheel-center {
            position: absolute; width: 110px; height: 110px;
            background: linear-gradient(180deg, var(--surface-light) 0%, var(--bg) 100%);
            border-radius: 50%; border: 3px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5; box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .slots-container { display: flex; gap: 12px; width: 100%; max-width: 360px; margin-bottom: 20px; }

        .slot-box {
            flex: 1; background: var(--surface-light); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 18px; padding: 12px 10px; display: flex; flex-direction: column;
            align-items: center; text-align: center; min-height: 135px; cursor: pointer;
        }
        .slot-box.target-active { border-color: rgba(255, 204, 0, 0.3); cursor: default; }
        .slot-title { font-size: 9px; color: var(--text-muted); margin-bottom: 10px; font-weight: 800; text-transform: uppercase;}
        .slot-img { width: 55px; height: 55px; object-fit: contain; margin-bottom: 10px; }
        .slot-price { background: rgba(0,0,0,0.4); padding: 4px 14px; border-radius: 10px; font-size: 13px; font-weight: 800; color: var(--accent); }
        .slot-placeholder { width: 55px; height: 55px; border: 2px dashed rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: rgba(255,255,255,0.2); margin-bottom: 10px; }

        .center-controls {
            width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center;
            background: var(--surface-light); border-radius: 24px; padding: 18px; border: 1px solid rgba(255,255,255,0.05);
        }

        .chance-display { font-size: 32px; font-weight: 900; color: var(--accent); margin-bottom: 2px; }
        .chance-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 18px; font-weight: 800; }

        .multiplier-panel { display: flex; gap: 6px; width: 100%; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .mult-btn {
            flex: 1; background: var(--surface); border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-muted); padding: 12px 5px; border-radius: 12px; font-weight: 800;
            font-size: 13px; font-family: inherit; min-width: 48px;
        }
        .mult-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        .action-btn { 
            width: 100%; padding: 18px; background: linear-gradient(180deg, #ffe066 0%, #ffcc00 100%);
            border: none; border-radius: 16px; font-weight: 900; font-size: 18px; color: #000;
            text-transform: uppercase; font-family: inherit;
        }
        .action-btn:disabled { background: #333; color: #666; }

        /* ЭКРАН КРАШ */
        #screen-crash { width: 100%; display: none; flex-direction: column; align-items: center; }
        
        .crash-graph {
            width: 100%; max-width: 360px; height: 250px; background: #0f0f15;
            border-radius: 24px; border: 1px solid var(--border); position: relative;
            overflow: hidden; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .crash-grid {
            position: absolute; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .crash-rocket {
            position: absolute; font-size: 32px; z-index: 10; transform: rotate(-45deg);
            display: none; transition: left 0.1s linear, bottom 0.1s linear;
        }

        .crash-value {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 52px; font-weight: 900; color: var(--text); z-index: 15;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .crash-value.crashed { color: var(--fail); text-shadow: 0 0 30px var(--fail); }
        .crash-value.won { color: var(--success); text-shadow: 0 0 30px var(--success); }

        .crash-controls {
            width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px;
        }

        .input-row { display: flex; gap: 10px; }
        .crash-input {
            flex: 1; background: var(--surface-light); border: 1px solid var(--border);
            border-radius: 14px; padding: 16px; color: #fff; font-size: 16px; font-weight: 700;
            font-family: inherit; text-align: center; outline: none;
        }
        .crash-input:focus { border-color: var(--accent); }

        .crash-btn {
            width: 100%; padding: 18px; border-radius: 16px; font-weight: 900;
            font-size: 18px; cursor: pointer; border: none; font-family: inherit; text-transform: uppercase;
        }
        .crash-btn.start { background: var(--accent); color: #000; }
        .crash-btn.cashout { background: var(--success); color: #000; display: none; }
        .crash-btn:disabled { opacity: 0.5; background: #333; color: #666; }

        /* Нижнее меню */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; 
            padding: 12px 10px 25px 10px; background: rgba(10, 10, 14, 0.95);
            backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05); z-index: 50;
        }
        .nav-item { color: var(--text-muted); font-size: 10px; text-align: center; cursor: pointer; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 6px; text-transform: uppercase;}
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 22px; }

        /* Модальные окна */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 100; display: none; flex-direction: column; justify-content: flex-end; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--surface); border-top-left-radius: 30px; border-top-right-radius: 30px; padding: 20px; height: 85vh; display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.08); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 20px; font-weight: 800; }
        .close-btn { background: var(--surface-light); border: none; color: var(--text); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        .inventory-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; overflow-y: auto; padding-bottom: 30px; }
        .inv-item { background: var(--surface-light); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 15px 10px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .inv-item img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px; }
        .inv-item .name { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
        .inv-item .price { font-size: 14px; color: var(--accent); font-weight: 800; margin-bottom: 12px;}
        .buy-btn { width: 100%; padding: 10px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; }
        .buy-btn:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); }

        .win-screen { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        .win-screen h2 { font-size: 32px; color: var(--success); margin-bottom: 25px; }
        .win-screen img { width: 130px; height: 130px; margin-bottom: 20px; }
        .win-screen .prize-name { font-size: 24px; font-weight: 800; margin-bottom: 5px; }
        .win-screen .prize-price { font-size: 20px; color: var(--accent); font-weight: 800; margin-bottom: 35px; }
        .win-actions { display: flex; gap: 12px; width: 100%; max-width: 320px; }
        .win-btn { flex: 1; padding: 16px; border-radius: 14px; font-weight: 800; font-size: 14px; cursor: pointer; border: none; font-family: inherit; text-transform: uppercase;}
        .win-btn.upgrade { background: var(--accent); color: #000; }
        .win-btn.sell { background: var(--surface-light); color: #fff; }

        .profile-card { background: var(--surface-light); border-radius: 20px; padding: 25px; width: 100%; max-width: 360px; text-align: center; }
        .promo-input { width: 100%; padding: 16px; background: var(--bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 16px; font-weight: 700; text-align: center; text-transform: uppercase; margin-bottom: 15px; outline: none; }

        .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--surface-light); border: 1px solid var(--accent); padding: 14px 28px; border-radius: 30px; font-weight: 700; font-size: 14px; z-index: 200; transition: 0.4s; opacity: 0; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">GIFT<span>UP</span></div>
        <div class="balance-container">
            <div class="balance"><span class="currency">₽</span> <span id="balance">0</span></div>
            <button class="btn-icon primary" onclick="openModal('deposit-modal')">+</button>
        </div>
    </div>

    <div class="main-content">
        
        <div class="game-switcher">
            <div class="game-tab active" id="tab-upgrade" onclick="switchGame('upgrade')">Апгрейд</div>
            <div class="game-tab" id="tab-crash" onclick="switchGame('crash')">Краш</div>
        </div>

        <!-- ЭКРАН: АПГРЕЙД -->
        <div id="screen-upgrade">
            <div class="wheel-wrapper">
                <div class="wheel" id="wheel">
                    <div class="wheel-center"><span style="font-size: 28px; font-weight: 900;">GIFT</span></div>
                </div>
                <div class="arrow-wrapper" id="arrow-wrapper"><div class="arrow-visual"></div></div>
            </div>

            <div class="slots-container">
                <div class="slot-box" id="slot-source" onclick="openInventory()"></div>
                <div class="slot-box target-active" id="slot-target"></div>
            </div>

            <div class="center-controls">
                <div class="chance-display" id="chance-value">75.00%</div>
                <div class="chance-label">ШАНС УСПЕХА</div>
                <div class="multiplier-panel">
                    <button class="mult-btn active" onclick="setMultiplier(1.5, this)">x1.5</button>
                    <button class="mult-btn" onclick="setMultiplier(2, this)">x2</button>
                    <button class="mult-btn" onclick="setMultiplier(3, this)">x3</button>
                    <button class="mult-btn" onclick="setMultiplier(5, this)">x5</button>
                    <button class="mult-btn" onclick="setMultiplier(10, this)">x10</button>
                </div>
                <button class="action-btn" id="spin-btn" onclick="spinUpgrade()">КРУТИТЬ</button>
            </div>
        </div>

        <!-- ЭКРАН: КРАШ -->
        <div id="screen-crash">
            <div class="crash-graph">
                <div class="crash-grid"></div>
                <div class="crash-rocket" id="crash-rocket">🚀</div>
                <div class="crash-value" id="crash-value">1.00x</div>
                <svg id="crash-svg" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
                    <path id="crash-path" d="M 0 250 Q 150 250, 300 0" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="2000" stroke-dashoffset="2000" />
                </svg>
            </div>

            <div class="crash-controls">
                <div class="input-row" id="crash-input-row">
                    <input type="number" class="crash-input" id="crash-bet" placeholder="Ставка (от 10)" value="100">
                </div>
                <button class="crash-btn start" id="crash-btn-start" onclick="startCrash()">НАЧАТЬ ИГРУ</button>
                <button class="crash-btn cashout" id="crash-btn-cashout" onclick="cashoutCrash()">ЗАБРАТЬ 0 ₽</button>
            </div>
        </div>

    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchGame('upgrade')"><span class="nav-icon">🎮</span>МИНИ-ИГРЫ</div>
        <div class="nav-item" onclick="openInventory()"><span class="nav-icon">🎒</span>ИНВЕНТАРЬ</div>
        <div class="nav-item" onclick="openShop()"><span class="nav-icon">🛒</span>МАГАЗИН</div>
        <div class="nav-item" onclick="openProfile()"><span class="nav-icon">👤</span>ПРОФИЛЬ</div>
    </div>

    <!-- Модальные окна -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal-content" style="height: auto; padding: 30px 20px;">
            <div class="modal-header"><div class="modal-title">Профиль</div><button class="close-btn" onclick="closeModal('profile-modal')">✕</button></div>
            <div class="profile-card">
                <div style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">Баланс: <span style="color: var(--accent); font-weight: 800;" id="profile-balance">0</span> ₽</div>
                <div style="text-align: left; margin-bottom: 10px; font-size: 14px; font-weight: 700; color: var(--text-muted);">Промокод:</div>
                <input type="text" class="promo-input" id="promo-code" placeholder="ВВЕДИТЕ КОД">
                <button class="action-btn" onclick="activatePromo()">АКТИВИРОВАТЬ</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="inventory-modal">
        <div class="modal-content">
            <div class="modal-header"><div class="modal-title">Ваш инвентарь</div><button class="close-btn" onclick="closeModal('inventory-modal')">✕</button></div>
            <div class="inventory-grid" id="inventory-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="shop-modal">
        <div class="modal-content">
            <div class="modal-header"><div class="modal-title">Магазин</div><button class="close-btn" onclick="closeModal('shop-modal')">✕</button></div>
            <div class="inventory-grid" id="shop-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="win-modal">
        <div class="modal-content" style="height: auto; padding: 40px 20px; text-align: center;">
            <div class="win-screen">
                <h2>ВЫИГРЫШ!</h2>
                <img src="" id="win-img" alt="Win">
                <div class="prize-name" id="win-name">Подарок</div>
                <div class="prize-price" id="win-price">100 ₽</div>
                <div class="win-actions">
                    <button class="win-btn upgrade" onclick="actionWinUpgrade()">В АПГРЕЙД</button>
                    <button class="win-btn sell" onclick="actionWinSell()">ПРОДАТЬ</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="item-action-modal">
        <div class="modal-content" style="height: auto; padding: 30px 20px; text-align: center;">
            <img src="" id="action-img" style="width: 100px; height: 100px; object-fit: contain; margin-bottom: 15px;">
            <div class="modal-title" id="action-name" style="font-size: 24px; margin-bottom: 5px;"></div>
            <div style="font-size: 18px; color: var(--accent); font-weight: 800; margin-bottom: 25px;" id="action-price"></div>
            <div class="win-actions">
                <button class="win-btn upgrade" onclick="setActionUpgrade()">В АПГРЕЙД</button>
                <button class="win-btn sell" onclick="setActionSell()">ПРОДАТЬ</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Текст</div>

    <script>
        let tg = window.Telegram.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        let userBalance = 0;
        let currentMultiplier = 1.5;
        let currentChance = 75;
        let isSpinning = false;

        // Переменные Краша
        let crashInterval = null;
        let crashMultiplier = 1.00;
        let crashBet = 0;
        let isCrashPlaying = false;
        let crashTargetPoint = 1.00;

        const allGifts = [
            { id: 1, name: "Кнопка", price: 5, img: "https://cdn-icons-png.flaticon.com/512/2985/2985114.png" },
            { id: 2, name: "Мишка", price: 50, img: "https://cdn-icons-png.flaticon.com/512/2985/2985114.png" },
            { id: 3, name: "Сердце", price: 150, img: "https://cdn-icons-png.flaticon.com/512/833/833472.png" },
            { id: 4, name: "Пицца", price: 200, img: "https://cdn-icons-png.flaticon.com/512/1404/1404945.png" },
            { id: 5, name: "Ракета", price: 500, img: "https://cdn-icons-png.flaticon.com/512/3212/3212608.png" },
            { id: 6, name: "Кот", price: 600, img: "https://cdn-icons-png.flaticon.com/512/616/616408.png" },
            { id: 7, name: "Молния", price: 1000, img: "https://cdn-icons-png.flaticon.com/512/3194/3194766.png" },
            { id: 8, name: "Корона", price: 3000, img: "https://cdn-icons-png.flaticon.com/512/2662/2662503.png" },
            { id: 9, name: "Звезда", price: 5000, img: "https://cdn-icons-png.flaticon.com/512/1828/1828884.png" },
            { id: 10, name: "Алмаз", price: 8000, img: "https://cdn-icons-png.flaticon.com/512/2954/2954941.png" }
        ];

        let userInventory = []; 
        let slotSourceGift = null;
        let slotTargetGift = null;
        let wonGift = null;
        let selectedInventoryItem = null;

        const promoCodes = { "START": 500, "GIFTUP": 1000, "LUCKY": 150, "TOP": 2000 };
        let usedPromos = []; 

        function saveData() { localStorage.setItem('giftup_data', JSON.stringify({ balance: userBalance, inventory: userInventory, usedPromos: usedPromos })); }
        function loadData() {
            const saved = localStorage.getItem('giftup_data');
            if (saved) {
                const data = JSON.parse(saved);
                userBalance = data.balance || 0;
                userInventory = data.inventory || [];
                usedPromos = data.usedPromos || [];
            }
        }

        function init() { loadData(); updateUI(); }

        function switchGame(game) {
            if (isSpinning || isCrashPlaying) return;
            document.getElementById('tab-upgrade').classList.toggle('active', game === 'upgrade');
            document.getElementById('tab-crash').classList.toggle('active', game === 'crash');
            document.getElementById('screen-upgrade').style.display = game === 'upgrade' ? 'flex' : 'none';
            document.getElementById('screen-crash').style.display = game === 'crash' ? 'flex' : 'none';
        }

        function updateTarget() {
            if (!slotSourceGift) { slotTargetGift = null; return; }
            const targetPrice = slotSourceGift.price * currentMultiplier;
            let closestGift = null, minDiff = Infinity;
            allGifts.forEach(gift => {
                if (gift.id === slotSourceGift.id) return;
                const diff = Math.abs(gift.price - targetPrice);
                if (gift.price >= targetPrice && diff < minDiff) { minDiff = diff; closestGift = gift; }
            });
            slotTargetGift = closestGift;
        }

        function updateUI() {
            document.getElementById('balance').innerText = userBalance.toFixed(0);
            if(document.getElementById('profile-balance')) document.getElementById('profile-balance').innerText = userBalance.toFixed(0);
            renderSlot('source', slotSourceGift);
            renderSlot('target', slotTargetGift);
            document.getElementById('chance-value').innerText = currentChance.toFixed(2) + '%';
            drawWheel();
        }

        function renderSlot(type, gift) {
            const el = document.getElementById(`slot-${type}`);
            const title = type === 'source' ? "ВАШ ПОДАРОК" : "ВЫ ПОЛУЧИТЕ";
            if (gift) {
                el.innerHTML = `<div class="slot-title">${title}</div><img src="${gift.img}" class="slot-img"><div class="slot-price">${gift.price} ₽</div>`;
            } else {
                el.innerHTML = `<div class="slot-title">${title}</div><div class="slot-placeholder">${type === 'target' ? '❌' : '+'}</div>`;
            }
        }

        // ИСПРАВЛЕНА ОТРИСОВКА (75% = 270 градусов)
        function drawWheel() {
            const wheel = document.getElementById('wheel');
            const deg = (currentChance / 100) * 360; // Для 75% будет 270 градусов
            const start = 180; // Начало внизу (6 часов)
            
            // Желтый сектор начинается с 180 и идет на deg градусов
            const end = start + deg; 
            
            // Отрисовка: серый до 180, желтый от 180 до end, серый от end до 360
            wheel.style.background = `conic-gradient(
                var(--surface) 0deg ${start}deg, 
                var(--accent) ${start}deg ${end}deg, 
                var(--surface) ${end}deg 360deg
            )`;
        }

        function setMultiplier(mult, btn) {
            if (isSpinning) return;
            currentMultiplier = mult;
            currentChance = 100 / mult;
            document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateTarget();
            updateUI();
        }

        // --- ЛОГИКА АПГРЕЙДА ---
        function spinUpgrade() {
            if (isSpinning || !slotSourceGift || !slotTargetGift) return;
            isSpinning = true;
            const btn = document.getElementById('spin-btn');
            const arrow = document.getElementById('arrow-wrapper');
            btn.disabled = true; btn.innerText = "КРУТИМ...";
            
            const win = Math.random() * 100 <= currentChance;
            const startDeg = 180;
            const yellowDeg = (currentChance / 100) * 360;
            
            let targetDeg = 0;
            if (win) {
                targetDeg = startDeg + Math.random() * yellowDeg;
            } else {
                targetDeg = startDeg + yellowDeg + Math.random() * (360 - yellowDeg);
            }

            // Крутим на 5 оборотов
            arrow.style.transition = `transform 5s cubic-bezier(0.15, 0.85, 0.15, 1)`;
            arrow.style.transform = `rotate(${360 * 5 + targetDeg}deg)`;

            setTimeout(() => {
                // 1. Сначала удаляем предмет, который крутили (он либо сгорел, либо улучшился)
                userInventory = userInventory.filter(g => g.id !== slotSourceGift.id);
                
                // 2. Если победа - добавляем новый
                if (win) {
                    wonGift = { ...slotTargetGift };
                    userInventory.push(wonGift);
                    showWinScreen(wonGift);
                } else {
                    showToast("ПРОВАЛ. Подарок сгорел.");
                }
                
                // 3. Очищаем слот и обновляем
                slotSourceGift = null;
                updateTarget();
                updateUI();
                saveData(); 

                setTimeout(() => {
                    arrow.style.transition = 'none';
                    arrow.style.transform = `rotate(0deg)`;
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerText = "КРУТИТЬ";
                        isSpinning = false;
                    }, 50);
                }, 500);
            }, 5000);
        }

        // --- ЛОГИКА КРАША ---
        function startCrash() {
            if (isCrashPlaying) return;
            
            const bet = parseInt(document.getElementById('crash-bet').value);
            if (isNaN(bet) || bet < 10) { showToast("Мин. ставка 10 ₽"); return; }
            if (bet > userBalance) { showToast("Недостаточно средств!"); return; }

            // Списываем ставку
            userBalance -= bet;
            crashBet = bet;
            updateUI();
            saveData();

            isCrashPlaying = true;
            crashMultiplier = 1.00;
            
            // UI подготовки
            document.getElementById('crash-input-row').style.display = 'none';
            document.getElementById('crash-btn-start').style.display = 'none';
            
            const cashoutBtn = document.getElementById('crash-btn-cashout');
            cashoutBtn.style.display = 'block';
            cashoutBtn.innerText = `ЗАБРАТЬ ${bet.toFixed(0)} ₽`;
            cashoutBtn.disabled = false;

            const crashValue = document.getElementById('crash-value');
            crashValue.className = 'crash-value';
            crashValue.innerText = '1.00x';

            const rocket = document.getElementById('crash-rocket');
            rocket.style.display = 'block';
            rocket.style.left = '10px';
            rocket.style.bottom = '10px';

            const path = document.getElementById('crash-path');
            path.style.stroke = 'var(--accent)';
            path.style.strokeDashoffset = '2000';

            // Генерируем точку краха
            const r = Math.random();
            crashTargetPoint = (1.1 + (Math.pow(r, 2) * 14)).toFixed(2); 
            
            let tick = 0;
            crashInterval = setInterval(() => {
                tick++;
                let speed = 0.01 + (1.5 / crashMultiplier) * 0.005; 
                crashMultiplier += speed;
                
                crashValue.innerText = crashMultiplier.toFixed(2) + 'x';
                cashoutBtn.innerText = `ЗАБРАТЬ ${Math.floor(bet * crashMultiplier)} ₽`;

                let x = 10 + (crashMultiplier - 1) * 30;
                let y = 10 + (crashMultiplier - 1) * 15;
                rocket.style.left = `${x}px`;
                rocket.style.bottom = `${y}px`;
                
                let percentX = Math.min((crashMultiplier - 1) / 10, 1) * 100;
                path.setAttribute('d', `M 0 250 Q ${percentX/2} 250, ${percentX}% 0`);
                path.style.strokeDashoffset = 2000 - (tick * 10);

                if (crashMultiplier >= parseFloat(crashTargetPoint)) {
                    crashGame();
                }
            }, 50);
        }

        function cashoutCrash() {
            if (!isCrashPlaying) return;
            
            clearInterval(crashInterval);
            isCrashPlaying = false;
            
            const winAmount = Math.floor(crashBet * crashMultiplier);
            userBalance += winAmount;
            
            const crashValue = document.getElementById('crash-value');
            crashValue.className = 'crash-value won';
            crashValue.innerText = `+${winAmount} ₽`;
            
            endCrashUI();
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            updateUI();
            saveData();
            showToast(`Вы забрали ${winAmount} ₽ на ${crashMultiplier.toFixed(2)}x!`);
        }

        function crashGame() {
            if (!isCrashPlaying) return;
            
            clearInterval(crashInterval);
            isCrashPlaying = false;
            
            const crashValue = document.getElementById('crash-value');
            crashValue.className = 'crash-value crashed';
            crashValue.innerText = `КРАШ ${crashMultiplier.toFixed(2)}x`;
            
            document.getElementById('crash-rocket').style.display = 'none';
            endCrashUI();
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            showToast("Ракета взорвалась! Вы потеряли ставку.");
            updateUI();
            saveData();
        }

        function endCrashUI() {
            document.getElementById('crash-input-row').style.display = 'flex';
            document.getElementById('crash-btn-start').style.display = 'block';
            document.getElementById('crash-btn-cashout').style.display = 'none';
            document.getElementById('crash-rocket').style.display = 'none';
        }

        // --- ОБЩИЕ УТИЛИТЫ ---
        function showWinScreen(gift) {
            document.getElementById('win-img').src = gift.img;
            document.getElementById('win-name').innerText = gift.name;
            document.getElementById('win-price').innerText = gift.price + ' ₽';
            openModal('win-modal');
        }

        function actionWinUpgrade() {
            slotSourceGift = wonGift;
            updateTarget();
            updateUI();
            closeModal('win-modal');
        }

        function actionWinSell() {
            userBalance += wonGift.price;
            userInventory = userInventory.filter(g => g.id !== wonGift.id);
            updateUI();
            saveData();
            closeModal('win-modal');
            showToast(`Продано за ${wonGift.price} ₽`);
        }

        function openProfile() { openModal('profile-modal'); }
        function activatePromo() {
            const input = document.getElementById('promo-code');
            const code = input.value.trim().toUpperCase();
            if (promoCodes[code] && !usedPromos.includes(code)) {
                userBalance += promoCodes[code];
                usedPromos.push(code);
                input.value = '';
                updateUI();
                saveData();
                showToast(`Успешно! +${promoCodes[code]} ₽`);
            } else {
                showToast("Неверный или использованный код!");
            }
        }

        function openInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            userInventory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'inv-item';
                div.innerHTML = `<img src="${item.img}"><div class="name">${item.name}</div><div class="price">${item.price} ₽</div>`;
                div.onclick = () => showItemAction(item);
                list.appendChild(div);
            });
            openModal('inventory-modal');
        }

        function showItemAction(item) {
            selectedInventoryItem = item;
            document.getElementById('action-img').src = item.img;
            document.getElementById('action-name').innerText = item.name;
            document.getElementById('action-price').innerText = item.price + ' ₽';
            closeModal('inventory-modal');
            openModal('item-action-modal');
        }

        function setActionUpgrade() {
            slotSourceGift = selectedInventoryItem;
            updateTarget(); updateUI();
            closeModal('item-action-modal');
            switchGame('upgrade');
        }

        function setActionSell() {
            userBalance += selectedInventoryItem.price;
            userInventory = userInventory.filter(g => g.id !== selectedInventoryItem.id);
            updateUI(); saveData();
            closeModal('item-action-modal');
            showToast(`Продано за ${selectedInventoryItem.price} ₽`);
        }

        function openShop() {
            const list = document.getElementById('shop-list');
            list.innerHTML = '';
            allGifts.forEach(item => {
                const div = document.createElement('div');
                div.className = 'inv-item';
                const canAfford = userBalance >= item.price;
                div.innerHTML = `<img src="${item.img}"><div class="name">${item.name}</div><div class="price">${item.price} ₽</div><button class="buy-btn" ${!canAfford ? 'disabled' : ''} onclick="buyGift(${item.id})">${canAfford ? 'КУПИТЬ' : 'НЕТ СРЕДСТВ'}</button>`;
                list.appendChild(div);
            });
            openModal('shop-modal');
        }

        function buyGift(id) {
            const gift = allGifts.find(g => g.id === id);
            if (userBalance >= gift.price) {
                userBalance -= gift.price;
                userInventory.push(gift);
                updateUI(); saveData();
                showToast(`Куплено: ${gift.name}`);
                openShop(); 
            }
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        init();
    </script>
</body>
</html>
