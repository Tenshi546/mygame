<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GiftUP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');

        :root { 
            --bg: #121216; 
            --surface: #1c1c22;
            --surface-light: #2a2a32;
            --text: #ffffff; 
            --text-muted: #8a8a9a;
            --accent: #ffcc00; 
            --accent-glow: rgba(255, 204, 0, 0.4);
            --success: #00ff88;
            --fail: #ff3333;
            --border: #33333d;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none;
            background-image: radial-gradient(circle at 50% 0%, #252530 0%, var(--bg) 70%);
        }
        
        /* Верхняя панель */
        .top-bar { 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10;
        }
        
        .logo { 
            font-weight: 900; 
            font-size: 24px; 
            letter-spacing: 1px; 
            text-transform: uppercase;
        }
        .logo span { color: var(--accent); }
        
        .balance-container { display: flex; align-items: center; gap: 10px; }

        .balance { 
            background: var(--surface-light); 
            padding: 8px 16px; 
            border-radius: 12px; 
            font-weight: 800;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .balance .currency { color: var(--accent); font-size: 14px; }

        .btn-add-balance {
            background: var(--accent);
            color: #000;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: 0.2s;
        }
        
        .btn-add-balance:active { transform: scale(0.9); }

        /* Основной контент */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 0 15px 90px 15px; 
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Колесо Крутки */
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Стрелка */
        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 35px solid var(--accent);
            z-index: 20;
            filter: drop-shadow(0 4px 10px var(--accent-glow));
        }

        /* Само колесо */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--surface-light);
            box-shadow: 0 0 40px rgba(0,0,0,0.8) inset, 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
            /* Фон будет меняться через JS (conic-gradient) */
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-center {
            position: absolute;
            width: 120px;
            height: 120px;
            background: var(--bg);
            border-radius: 50%;
            border: 4px solid var(--surface-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
        }

        /* Слоты (Ваш подарок и Авто-цель) */
        .slots-container {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 20px;
        }

        .slot-box {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: 0.3s;
            min-height: 130px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .slot-box:active { transform: scale(0.97); }
        .slot-box.target-active { border-color: var(--accent); box-shadow: 0 0 20px rgba(255,204,0,0.15); cursor: default; }

        .slot-title { font-size: 10px; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .slot-img {
            width: 55px; height: 55px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6));
        }

        .slot-price {
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--accent);
        }

        .slot-placeholder {
            width: 55px; height: 55px;
            border: 2px dashed #444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #444;
            margin-bottom: 8px;
        }

        /* Панель управления */
        .center-controls {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--surface);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .chance-display {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: 2px;
        }
        .chance-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* Панель множителей */
        .multiplier-panel {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 15px;
        }
        
        .mult-btn {
            flex: 1;
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 12px 0;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            font-size: 15px;
            font-family: inherit;
        }

        .mult-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Кнопка действия */
        .action-btn { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(180deg, #ffdd33 0%, #ffcc00 100%);
            border: none; 
            border-radius: 14px; 
            font-weight: 900; 
            font-size: 18px; 
            color: #000; 
            cursor: pointer; 
            box-shadow: 0 8px 25px var(--accent-glow);
            transition: 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
        }
        
        .action-btn:active { transform: scale(0.97); }
        .action-btn:disabled { background: #333; color: #666; box-shadow: none; }

        /* Нижнее меню */
        .bottom-nav { 
            position: fixed;
            bottom: 0; left: 0; right: 0;
            display: flex; 
            justify-content: space-around; 
            padding: 12px 10px 25px 10px; 
            background: rgba(18, 18, 22, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border); 
            z-index: 50;
        }
        
        .nav-item { 
            color: var(--text-muted); 
            font-size: 10px; 
            text-align: center; 
            cursor: pointer; 
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }
        
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 22px; }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
        }
        
        .modal-overlay.active { display: flex; }
        
        .modal-content {
            background: var(--surface);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s cubic-bezier(0.1, 0.7, 0.1, 1);
            border-top: 1px solid var(--border);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title { font-size: 20px; font-weight: 800; }
        
        .close-btn {
            background: var(--surface-light); 
            border: none; 
            color: var(--text); 
            width: 32px; height: 32px; 
            border-radius: 50%; 
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            overflow-y: auto;
            padding-bottom: 30px;
        }

        .inv-item {
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .inv-item:active { transform: scale(0.95); border-color: var(--accent); }

        .inv-item img {
            width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }
        
        .inv-item .name { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
        .inv-item .price { font-size: 14px; color: var(--accent); font-weight: 800; display: flex; align-items: center; gap: 3px;}

        /* Экран победы */
        .win-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .win-screen h2 { font-size: 28px; color: var(--success); margin-bottom: 20px; text-shadow: 0 0 20px rgba(0,255,136,0.5); }
        .win-screen img { width: 120px; height: 120px; margin-bottom: 15px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); }
        .win-screen .prize-name { font-size: 22px; font-weight: 800; margin-bottom: 5px; }
        .win-screen .prize-price { font-size: 18px; color: var(--accent); font-weight: 800; margin-bottom: 30px; }
        
        .win-actions { display: flex; gap: 10px; width: 100%; max-width: 300px; }
        .win-btn { 
            flex: 1; padding: 15px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; border: none; font-family: inherit;
        }
        .win-btn.upgrade { background: var(--accent); color: #000; box-shadow: 0 4px 15px var(--accent-glow); }
        .win-btn.sell { background: var(--surface-light); color: #fff; border: 1px solid var(--border); }

        /* Тост */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--surface-light);
            border: 1px solid var(--accent);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            z-index: 200;
            transition: 0.3s;
            opacity: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">GIFT<span>UP</span></div>
        <div class="balance-container">
            <div class="balance"><span class="currency">₽</span> <span id="balance">1250</span></div>
            <button class="btn-add-balance" onclick="openModal('deposit-modal')">+</button>
        </div>
    </div>

    <div class="main-content">
        
        <!-- Колесо -->
        <div class="wheel-wrapper">
            <div class="wheel-pointer"></div>
            <div class="wheel" id="wheel">
                <div class="wheel-center">
                    <span style="font-size: 24px; font-weight: 900; color: var(--text);">GIFT</span>
                    <span style="font-size: 10px; color: var(--text-muted); margin-top: 2px;">UP</span>
                </div>
            </div>
        </div>

        <!-- Слоты -->
        <div class="slots-container">
            <!-- Левый слот (выбор) -->
            <div class="slot-box" id="slot-source" onclick="openInventory()">
                <!-- JS -->
            </div>
            
            <!-- Правый слот (авто-цель) -->
            <div class="slot-box target-active" id="slot-target">
                <!-- JS -->
            </div>
        </div>

        <!-- Управление -->
        <div class="center-controls">
            <div class="chance-display" id="chance-value">50.00%</div>
            <div class="chance-label">ШАНС УСПЕХА</div>

            <div class="multiplier-panel">
                <button class="mult-btn active" onclick="setMultiplier(2, this)">x2</button>
                <button class="mult-btn" onclick="setMultiplier(3, this)">x3</button>
                <button class="mult-btn" onclick="setMultiplier(4, this)">x4</button>
                <button class="mult-btn" onclick="setMultiplier(5, this)">x5</button>
                <button class="mult-btn" onclick="setMultiplier(10, this)">x10</button>
            </div>

            <button class="action-btn" id="spin-btn" onclick="spin()">КРУТИТЬ</button>
        </div>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <div class="nav-item active"><span class="nav-icon">🎮</span>ИГРА</div>
        <div class="nav-item" onclick="openInventory()"><span class="nav-icon">🎁</span>ИНВЕНТАРЬ</div>
        <div class="nav-item" onclick="openModal('deposit-modal')"><span class="nav-icon">💳</span>БАЛАНС</div>
        <div class="nav-item" onclick="showToast('Профиль в разработке')"><span class="nav-icon">👤</span>ПРОФИЛЬ</div>
    </div>

    <!-- Модальное окно: Инвентарь -->
    <div class="modal-overlay" id="inventory-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Ваш инвентарь</div>
                <button class="close-btn" onclick="closeModal('inventory-modal')">✕</button>
            </div>
            <div class="inventory-grid" id="inventory-list">
                <!-- JS -->
            </div>
        </div>
    </div>

    <!-- Модальное окно: Экран Победы -->
    <div class="modal-overlay" id="win-modal">
        <div class="modal-content" style="height: auto; padding: 40px 20px;">
            <div class="win-screen">
                <h2>ВЫИГРЫШ!</h2>
                <img src="" id="win-img" alt="Win">
                <div class="prize-name" id="win-name">Подарок</div>
                <div class="prize-price" id="win-price">100 ₽</div>
                
                <div class="win-actions">
                    <button class="win-btn upgrade" onclick="actionUpgrade()">В АПГРЕЙД</button>
                    <button class="win-btn sell" onclick="actionSell()">ПРОДАТЬ ЗА <span id="sell-price">80</span> ₽</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно: Пополнение -->
    <div class="modal-overlay" id="deposit-modal">
        <div class="modal-content" style="height: auto; max-height: 80vh;">
            <div class="modal-header">
                <div class="modal-title">Пополнение</div>
                <button class="close-btn" onclick="closeModal('deposit-modal')">✕</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="inv-item" style="flex-direction: row; justify-content: space-between; padding: 15px 20px;" onclick="showToast('В разработке')">
                    <span>💳 Банковская карта</span> <span>→</span>
                </button>
                <button class="inv-item" style="flex-direction: row; justify-content: space-between; padding: 15px 20px;" onclick="showToast('В разработке')">
                    <span>⭐ Telegram Stars</span> <span>→</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Тост -->
    <div class="toast" id="toast">Текст</div>

    <script>
        let tg = window.Telegram.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // --- ДАННЫЕ ---
        let userBalance = 1250;
        let currentMultiplier = 2;
        let currentChance = 50;
        let isSpinning = false;

        // БАЗА ПОДАРКОВ (30 штук, отсортированы по цене)
        const allGifts = [
            { id: 1, name: "Мишка", price: 50, img: "https://cdn-icons-png.flaticon.com/512/2985/2985114.png" },
            { id: 2, name: "Сердце", price: 100, img: "https://cdn-icons-png.flaticon.com/512/833/833472.png" },
            { id: 3, name: "Пицца", price: 150, img: "https://cdn-icons-png.flaticon.com/512/1404/1404945.png" },
            { id: 4, name: "Огонь", price: 200, img: "https://cdn-icons-png.flaticon.com/512/785/785116.png" },
            { id: 5, name: "Ракета", price: 250, img: "https://cdn-icons-png.flaticon.com/512/3212/3212608.png" },
            { id: 6, name: "Кот", price: 300, img: "https://cdn-icons-png.flaticon.com/512/616/616408.png" },
            { id: 7, name: "Собака", price: 400, img: "https://cdn-icons-png.flaticon.com/512/616/616430.png" },
            { id: 8, name: "Молния", price: 450, img: "https://cdn-icons-png.flaticon.com/512/3194/3194766.png" },
            { id: 9, name: "Кубок", price: 500, img: "https://cdn-icons-png.flaticon.com/512/3112/3112946.png" },
            { id: 10, name: "Снежинка", price: 600, img: "https://cdn-icons-png.flaticon.com/512/3194/3194789.png" },
            { id: 11, name: "Череп", price: 700, img: "https://cdn-icons-png.flaticon.com/512/2954/2954952.png" },
            { id: 12, name: "Дельфин", price: 800, img: "https://cdn-icons-png.flaticon.com/512/616/616494.png" },
            { id: 13, name: "Призрак", price: 900, img: "https://cdn-icons-png.flaticon.com/512/3325/3325133.png" },
            { id: 14, name: "Корона", price: 1000, img: "https://cdn-icons-png.flaticon.com/512/2662/2662503.png" },
            { id: 15, name: "Меч", price: 1100, img: "https://cdn-icons-png.flaticon.com/512/3112/3112947.png" },
            { id: 16, name: "Бабочка", price: 1200, img: "https://cdn-icons-png.flaticon.com/512/616/616565.png" },
            { id: 17, name: "Щит", price: 1400, img: "https://cdn-icons-png.flaticon.com/512/3112/3112956.png" },
            { id: 18, name: "Звезда", price: 1500, img: "https://cdn-icons-png.flaticon.com/512/1828/1828884.png" },
            { id: 19, name: "Робот", price: 1800, img: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png" },
            { id: 20, name: "Замок", price: 2000, img: "https://cdn-icons-png.flaticon.com/512/3063/3063822.png" },
            { id: 21, name: "Алмаз", price: 2500, img: "https://cdn-icons-png.flaticon.com/512/2954/2954941.png" },
            { id: 22, name: "Дракон", price: 3000, img: "https://cdn-icons-png.flaticon.com/512/3468/3468081.png" },
            { id: 23, name: "Единорог", price: 3500, img: "https://cdn-icons-png.flaticon.com/512/3468/3468103.png" },
            { id: 24, name: "Планета", price: 4000, img: "https://cdn-icons-png.flaticon.com/512/3212/3212625.png" },
            { id: 25, name: "Феникс", price: 5000, img: "https://cdn-icons-png.flaticon.com/512/3468/3468115.png" },
            { id: 26, name: "Космос", price: 6000, img: "https://cdn-icons-png.flaticon.com/512/3212/3212620.png" }
        ];

        // Инвентарь игрока
        let userInventory = [
            allGifts[0], // Мишка 50
            allGifts[1], // Сердце 100
            allGifts[4]  // Ракета 250
        ];

        let slotSourceGift = userInventory[0]; // Выбранный предмет
        let slotTargetGift = null; // Автоматическая цель
        let wonGift = null;

        // --- ИНИЦИАЛИЗАЦИЯ ---
        function init() {
            updateTarget(); // Сразу считаем цель
            updateUI();
        }

        // Логика автоматического подбора цели
        function updateTarget() {
            if (!slotSourceGift) {
                slotTargetGift = null;
                return;
            }
            
            const targetPrice = slotSourceGift.price * currentMultiplier;
            
            // Ищем подарок, который максимально близок к нужной цене (или выше, если нет точного)
            // Сортируем по разнице цен
            let closestGift = null;
            let minDiff = Infinity;

            allGifts.forEach(gift => {
                // Нельзя выбирать тот же самый подарок
                if (gift.id === slotSourceGift.id) return;
                
                const diff = Math.abs(gift.price - targetPrice);
                // Приоритет подаркам, которые дороже или равны
                const isAbove = gift.price >= targetPrice;
                
                if (isAbove && diff < minDiff) {
                    minDiff = diff;
                    closestGift = gift;
                } else if (!closestGift && diff < minDiff) {
                    // Если ничего не нашли выше, берем ближайший снизу
                    minDiff = diff;
                    closestGift = gift;
                }
            });

            slotTargetGift = closestGift;
        }

        function updateUI() {
            document.getElementById('balance').innerText = userBalance.toFixed(0);
            renderSlot('source', slotSourceGift);
            renderSlot('target', slotTargetGift);
            document.getElementById('chance-value').innerText = currentChance.toFixed(2) + '%';
            drawWheel();
        }

        function renderSlot(type, gift) {
            const el = document.getElementById(`slot-${type}`);
            const title = type === 'source' ? "ВАШ ПОДАРОК" : "ВЫ ПОЛУЧИТЕ";
            
            if (gift) {
                el.innerHTML = `
                    <div class="slot-title">${title}</div>
                    <img src="${gift.img}" class="slot-img">
                    <div class="slot-price">${gift.price} ₽</div>
                `;
            } else {
                el.innerHTML = `
                    <div class="slot-title">${title}</div>
                    <div class="slot-placeholder">+</div>
                `;
            }
        }

        // --- ОТРИСОВКА КОЛЕСА ---
        function drawWheel() {
            const wheel = document.getElementById('wheel');
            // Желтая часть (шанс). Отсчет идет от 12 часов (0 градусов) по часовой стрелке.
            const deg = (currentChance / 100) * 360;
            
            // conic-gradient(from 0deg, цвет1 0deg Xdeg, цвет2 Xdeg 360deg)
            wheel.style.background = `conic-gradient(
                var(--accent) 0deg ${deg}deg, 
                var(--surface-light) ${deg}deg 360deg
            )`;
        }

        // --- ВЗАИМОДЕЙСТВИЕ ---
        function setMultiplier(mult, btn) {
            if (isSpinning) return;
            currentMultiplier = mult;
            currentChance = 100 / mult;
            
            document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            updateTarget();
            updateUI();
        }

        function openInventory() {
            if (isSpinning) return;
            renderInventoryList();
            openModal('inventory-modal');
        }

        function renderInventoryList() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            
            userInventory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'inv-item';
                div.innerHTML = `
                    <img src="${item.img}">
                    <div class="name">${item.name}</div>
                    <div class="price">${item.price} ₽</div>
                `;
                
                div.onclick = () => {
                    slotSourceGift = item;
                    updateTarget();
                    updateUI();
                    closeModal('inventory-modal');
                };
                list.appendChild(div);
            });
        }

        // --- АНИМАЦИЯ КРУТКИ ---
        function spin() {
            if (isSpinning) return;
            if (!slotSourceGift) {
                showToast("Выберите подарок!");
                return;
            }
            
            isSpinning = true;
            const btn = document.getElementById('spin-btn');
            const wheel = document.getElementById('wheel');
            
            btn.disabled = true;
            btn.innerText = "КРУТИМ...";
            
            // Определяем победу
            const win = Math.random() * 100 <= currentChance;
            
            // Вычисляем угол для стрелки
            // Если победа - останавливаем в желтой зоне (от 0 до currentChance градусов)
            // Если проигрыш - в темной зоне
            let targetAngle = 0;
            if (win) {
                targetAngle = Math.random() * (currentChance / 100 * 360);
            } else {
                const startDark = (currentChance / 100 * 360);
                targetAngle = startDark + Math.random() * (360 - startDark);
            }

            // Крутим на 5 полных оборотов + нужный угол
            // Так как стрелка сверху, а колесо крутится, чтобы стрелка попала в targetAngle, 
            // колесо должно повернуться на (360 - targetAngle)
            const finalRotation = (360 * 5) + (360 - targetAngle);
            
            wheel.style.transform = `rotate(${finalRotation}deg)`;

            setTimeout(() => {
                if (win) {
                    wonGift = { ...slotTargetGift };
                    showWinScreen(wonGift);
                } else {
                    showToast("ПРОВАЛ. Подарок сгорел.");
                    slotSourceGift = null;
                    // Удаляем сгоревший предмет из инвентаря
                    userInventory = userInventory.filter(g => g.id !== slotSourceGift?.id);
                    updateUI();
                }

                // Возврат колеса
                setTimeout(() => {
                    wheel.style.transition = 'none';
                    wheel.style.transform = `rotate(0deg)`;
                    
                    setTimeout(() => {
                        wheel.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)';
                        btn.disabled = false;
                        btn.innerText = "КРУТИТЬ";
                        isSpinning = false;
                        updateTarget();
                        updateUI();
                    }, 50);
                }, 500);

            }, 4000);
        }

        // --- ЭКРАН ПОБЕДЫ ---
        function showWinScreen(gift) {
            document.getElementById('win-img').src = gift.img;
            document.getElementById('win-name').innerText = gift.name;
            document.getElementById('win-price').innerText = gift.price + ' ₽';
            document.getElementById('sell-price').innerText = Math.floor(gift.price * 0.8);
            
            openModal('win-modal');
        }

        function actionUpgrade() {
            // Добавляем в инвентарь
            if (!userInventory.find(g => g.id === wonGift.id)) {
                userInventory.push(wonGift);
            }
            // Ставим выигранный подарок в слот
            slotSourceGift = wonGift;
            updateTarget();
            updateUI();
            closeModal('win-modal');
        }

        function actionSell() {
            const sellPrice = Math.floor(wonGift.price * 0.8);
            userBalance += sellPrice;
            
            // Очищаем старый подарок, так как он "сгорел" при крутке
            userInventory = userInventory.filter(g => g.id !== slotSourceGift?.id);
            
            // Слот пустой
            slotSourceGift = null;
            updateTarget();
            updateUI();
            closeModal('win-modal');
            showToast(`Продано за ${sellPrice} ₽`);
        }

        // --- УТИЛИТЫ ---
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Запуск
        init();

    </script>
</body>
    </html>
